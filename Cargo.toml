[package]
name = "latex-reader"
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
description = "Reads LaTeX documents into semantic events with source ranges: numbering, references, scoped macros, and formulas prepared for KaTeX, without a TeX engine."
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/latex-reader"
repository = "https://github.com/garlab/latex-reader"
keywords = ["latex", "tex", "parser", "katex", "document"]
categories = ["parser-implementations", "text-processing"]
include = ["src/**", "tests/**", "examples/**", "README.md", "LICENSE", "Cargo.toml"]

[dependencies]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
